# docker-compose.prod.yml — producción en DonWeb
# Las imágenes de api y web las compila GitHub Actions (.github/workflows/deploy.yml) y el
# servidor solo las descarga: deploy/deploy.sh fija IMAGE_TAG en el .env y hace pull + up.
# Variables: se leen del archivo .env en la misma carpeta (ver .env.prod.example).
# Ojo: el contenedor solo recibe las variables listadas en su "environment"; tener una
# variable en el .env no alcanza para que le llegue a Spring.

# Sin esto Docker guarda los logs sin límite y llenan el disco del VPS. Se conservan ~50 MB por
# servicio (5 archivos de 10 MB); `docker compose logs` sigue funcionando igual.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: banco_anteojos
      POSTGRES_USER: banco_app
      POSTGRES_PASSWORD: ${DB_PASSWORD:?falta DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Solo en el loopback del servidor, para entrar con pgAdmin por túnel SSH (ver docs/DEPLOY.md).
    # NUNCA "5432:5432" a secas: Docker se saltea UFW y la base quedaría abierta a Internet.
    ports:
      - "127.0.0.1:5432:5432"
    mem_limit: 512m
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U banco_app -d banco_anteojos"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    image: ghcr.io/ivanochoa229/banco-anteojos-api:${IMAGE_TAG:-local}
    # Solo para un build de emergencia en el servidor (up -d --build); ver docs/DEPLOY.md.
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      PORT: 8080
      JAVA_OPTS: "-Xmx512m -Xss512k -XX:MaxMetaspaceSize=192m -XX:ReservedCodeCacheSize=64m -XX:+UseSerialGC -XX:+ExitOnOutOfMemoryError"
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: banco_anteojos
      DB_USER: banco_app
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?falta JWT_SECRET}
      FRONTEND_URL: https://${DOMAIN}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY}
      R2_BUCKET: ${R2_BUCKET}
      TRACK17_API_KEY: ${TRACK17_API_KEY}
      # SMTP de notificaciones de turnos (RF-22). Sin MAIL_HOST el envío se saltea con un log.
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-}
    # SIN "ports": solo Caddy le habla por la red interna
    mem_limit: 1g
    logging: *default-logging

  web:
    image: ghcr.io/ivanochoa229/banco-anteojos-web:${IMAGE_TAG:-local}
    build:
      context: ./frontend
      args:
        VITE_API_URL: https://api.${DOMAIN}
    restart: unless-stopped
    depends_on:
      - api
    environment:
      DOMAIN: ${DOMAIN:?falta DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"     # HTTP/3
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data       # certificados: NO borrar (Let's Encrypt limita emisiones)
      - caddy_config:/config
    mem_limit: 256m
    logging: *default-logging

volumes:
  pgdata:
  caddy_data:
  caddy_config:
