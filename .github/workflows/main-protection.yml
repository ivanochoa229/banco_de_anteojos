# Protección de main: todo PR hacia main tiene que compilar y pasar los tests.
# Para que BLOQUEE el merge, los jobs de abajo se marcan como "required status checks"
# en Settings > Branches > regla de main (un workflow solo no impide el merge).
name: Main protection

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: main-protection-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend-tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: banco
          POSTGRES_PASSWORD: banco
          POSTGRES_DB: banco_anteojos_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U banco"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven
      - name: Tests
        run: ./mvnw -B test
        env:
          TEST_DB_URL: jdbc:postgresql://localhost:5433/banco_anteojos_test
          TEST_DB_USERNAME: banco
          TEST_DB_PASSWORD: banco

  frontend:
    name: frontend-build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
