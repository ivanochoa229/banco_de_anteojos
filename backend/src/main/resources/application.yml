spring:
  application:
    name: banco-anteojos-backend
  # Carga el .env local (no versionado) como propiedades; en producción (Docker Compose)
  # las variables llegan por entorno y el import se ignora por ser optional.
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/banco_anteojos}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  # SMTP para notificaciones de turnos (RF-22). Sin MAIL_HOST el envío se saltea con un log:
  # las notificaciones son best effort y nunca cortan el flujo.
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

notifications:
  mail:
    from: ${MAIL_FROM:${MAIL_USERNAME:}}

jwt:
  secret: ${JWT_SECRET:}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}

# En dev el frontend pega al backend por el proxy de Vite (mismo origen); CORS solo hace falta
# cuando el front y la API viven en dominios distintos, como en producción.
cors:
  allowed-origins: ${FRONTEND_URL:http://localhost:5173}

bootstrap:
  admin:
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}
  # Operador de desarrollo (ver CREDENTIALS.md): se crea o se resetea a esta contraseña en cada
  # arranque. En producción application-prod.yml lo deja vacío: los operadores los da de alta el DBA.
  operator:
    email: ${OPERATOR_EMAIL:operador@bancodeanteojos.org}
    password: ${OPERATOR_PASSWORD:OperadorPassword123!}

# Cloudflare R2. Un solo bucket PRIVADO: todo se sirve con presigned URLs, nunca por URL pública.
# Las recetas son datos de salud (RNF-02, Ley 25.326) y no pueden quedar accesibles sin firma.
# 17TRACK (seguimiento de Vía Cargo, RF-23/24). La misma API key firma los webhooks entrantes.
track17:
  api-key: ${TRACK17_API_KEY:}
  base-url: https://api.17track.net/track/v2.4

r2:
  account-id: ${R2_ACCOUNT_ID:}
  access-key-id: ${R2_ACCESS_KEY_ID:}
  secret-access-key: ${R2_SECRET_ACCESS_KEY:}
  bucket: ${R2_BUCKET:}
  presigned-url-ttl-minutes: ${R2_PRESIGNED_URL_TTL_MINUTES:15}

logging:
  # Contexto de la petición (RequestLoggingFilter) al final de cada línea; vacío fuera de una petición.
  pattern:
    dateformat: "dd/MM/yyyy HH:mm:ss.SSS,America/Argentina/Tucuman"
    console: "%d{${LOG_DATEFORMAT_PATTERN}} %5p [%t] %-36.36logger{35} - %m [traceId:%X{traceId:-}] [user:%X{username:-}] [ip:%X{sourceIp:-}] [%X{httpMethod:-} %X{path:-}]%n%wEx"
