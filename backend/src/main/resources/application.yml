spring:
  application:
    name: banco-anteojos-backend
  # Carga el .env local (no versionado) como propiedades; en Render las variables
  # llegan por entorno y el import se ignora por ser optional.
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/banco_anteojos}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  # SMTP para notificaciones de turnos (RF-22). Sin MAIL_HOST el envío se saltea con un log:
  # las notificaciones son best effort y nunca cortan el flujo.
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

notifications:
  mail:
    from: ${MAIL_FROM:${MAIL_USERNAME:}}

jwt:
  secret: ${JWT_SECRET:}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}

bootstrap:
  admin:
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}

# Cloudflare R2. Un solo bucket PRIVADO: todo se sirve con presigned URLs, nunca por URL pública.
# Las recetas son datos de salud (RNF-02, Ley 25.326) y no pueden quedar accesibles sin firma.
# 17TRACK (seguimiento de Vía Cargo, RF-23/24). La misma API key firma los webhooks entrantes.
track17:
  api-key: ${TRACK17_API_KEY:}
  base-url: https://api.17track.net/track/v2.4

r2:
  account-id: ${R2_ACCOUNT_ID:}
  access-key-id: ${R2_ACCESS_KEY_ID:}
  secret-access-key: ${R2_SECRET_ACCESS_KEY:}
  bucket: ${R2_BUCKET:}
  presigned-url-ttl-minutes: ${R2_PRESIGNED_URL_TTL_MINUTES:15}
